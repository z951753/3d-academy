name = "3d-academy-api"
main = "worker/index.js"
compatibility_date = "2024-01-01"

# ========================================
# D1 数据库绑定
# 创建命令: npx wrangler d1 create 3d-academy-db
# 然后把返回的 database_id 填入下方
# ========================================
[[d1_databases]]
binding = "DB"
database_name = "3d-academy-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"  # ← 替换为你的 D1 Database ID

# ========================================
# R2 存储绑定（可选，用于文件上传）
# 创建命令: npx wrangler r2 bucket create 3d-academy-files
# 首次使用需在 Dashboard > R2 启用（免费）
# ========================================
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "3d-academy-files"

# ========================================
# 环境变量
# ========================================
[vars]
JWT_SECRET = "change-this-to-a-random-secret-at-least-32-chars"  # ← 生产环境请更换为强密钥
APP_URL = "https://3d-academy.pages.dev"                          # ← 你的 Pages 域名

# 开发环境端口（本地调试用）
# [dev]
# port = 8787
